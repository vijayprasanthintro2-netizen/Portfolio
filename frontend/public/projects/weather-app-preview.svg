<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-label="UI concept preview of the Weather App interface">
  <defs>
    <linearGradient id="wa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1228"/>
      <stop offset="1" stop-color="#12324d"/>
    </linearGradient>
    <linearGradient id="wa-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="wa-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="720" height="450" fill="url(#wa-bg)"/>
  <circle cx="330" cy="150" r="140" fill="#22d3ee" opacity="0.08"/>
  <circle cx="330" cy="150" r="90" fill="#22d3ee" opacity="0.06"/>

  <!-- browser chrome -->
  <rect x="40" y="26" width="640" height="398" rx="16" fill="rgba(8,14,30,0.9)" stroke="rgba(255,255,255,0.12)"/>
  <circle cx="66" cy="48" r="5" fill="#f87171"/>
  <circle cx="84" cy="48" r="5" fill="#fbbf24"/>
  <circle cx="102" cy="48" r="5" fill="#34d399"/>
  <rect x="130" y="39" width="520" height="18" rx="9" fill="rgba(255,255,255,0.06)"/>
  <text x="392" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b93b4" text-anchor="middle">weather.app</text>

  <!-- search bar -->
  <rect x="66" y="84" width="588" height="42" rx="21" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="92" cy="105" r="8" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <text x="112" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5f6a8e">Search for a city...</text>

  <!-- main panel -->
  <rect x="66" y="142" width="320" height="254" rx="18" fill="url(#wa-cyan)" opacity="0.14" stroke="rgba(34,211,238,0.35)"/>

  <!-- sun -->
  <g transform="translate(116, 214)">
    <circle r="30" fill="url(#wa-sun)"/>
    <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-50"/>
      <line x1="0" y1="40" x2="0" y2="50"/>
      <line x1="-40" y1="0" x2="-50" y2="0"/>
      <line x1="40" y1="0" x2="50" y2="0"/>
      <line x1="-28" y1="-28" x2="-35" y2="-35"/>
      <line x1="28" y1="-28" x2="35" y2="-35"/>
      <line x1="-28" y1="28" x2="-35" y2="35"/>
      <line x1="28" y1="28" x2="35" y2="35"/>
    </g>
  </g>

  <text x="222" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#f4f6ff">27°</text>
  <text x="226" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c8d3ef">Clear Sky</text>
  <text x="226" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b4">Tiruchengode</text>
  <text x="226" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b4">H: 31°   L: 22°</text>
  <text x="92" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b4">Humidity 48%</text>
  <text x="252" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b4">Wind 12 km/h</text>

  <!-- forecast -->
  <text x="412" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d3ef">7-day forecast</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="412" y="192" width="274" height="52" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
    <text x="430" y="223" font-size="12" fill="#8b93b4">Today</text>
    <circle cx="520" cy="218" r="9" fill="#fbbf24" opacity="0.85"/>
    <text x="586" y="223" font-size="12" fill="#eef1ff">31°</text>
    <text x="628" y="223" font-size="12" fill="#8b93b4">22°</text>

    <rect x="412" y="252" width="274" height="52" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
    <text x="430" y="283" font-size="12" fill="#8b93b4">Tomorrow</text>
    <path d="M511 215 a9 9 0 1 1 18 0 Z" fill="#94a3b8" opacity="0.7"/>
    <text x="586" y="283" font-size="12" fill="#eef1ff">29°</text>
    <text x="628" y="283" font-size="12" fill="#8b93b4">21°</text>

    <rect x="412" y="312" width="274" height="52" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
    <text x="430" y="343" font-size="12" fill="#8b93b4">Wednesday</text>
    <path d="M513 348 l-4 -10 h8 Z" fill="#22d3ee" opacity="0.8"/>
    <path d="M506 342 h20 a4 4 0 0 1 0 8 Z" fill="#22d3ee" opacity="0.8"/>
    <text x="586" y="343" font-size="12" fill="#eef1ff">30°</text>
    <text x="628" y="343" font-size="12" fill="#8b93b4">23°</text>
  </g>
</svg>
