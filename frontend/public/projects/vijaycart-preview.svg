<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-label="UI concept preview of the VijayCart e-commerce storefront">
  <defs>
    <linearGradient id="vc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="1" stop-color="#121733"/>
    </linearGradient>
    <linearGradient id="vc-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="vc-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="720" height="450" fill="url(#vc-bg)"/>

  <!-- browser chrome -->
  <rect x="40" y="26" width="640" height="398" rx="16" fill="#0e1327" stroke="rgba(255,255,255,0.12)"/>
  <circle cx="66" cy="48" r="5" fill="#f87171"/>
  <circle cx="84" cy="48" r="5" fill="#fbbf24"/>
  <circle cx="102" cy="48" r="5" fill="#34d399"/>
  <rect x="130" y="39" width="520" height="18" rx="9" fill="rgba(255,255,255,0.06)"/>
  <text x="392" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b93b4" text-anchor="middle">vijaycart.app</text>

  <!-- navbar -->
  <rect x="56" y="72" width="608" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
  <circle cx="78" cy="98" r="9" fill="url(#vc-accent)"/>
  <text x="94" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#eef1ff">VijayCart</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b93b4">
    <text x="176" y="102">Home</text>
    <text x="228" y="102">Shop</text>
    <text x="278" y="102">Categories</text>
    <text x="358" y="102">Deals</text>
  </g>
  <rect x="592" y="84" width="56" height="28" rx="14" fill="url(#vc-cta)"/>
  <text x="620" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Sign in</text>

  <!-- hero strip -->
  <rect x="56" y="140" width="608" height="82" rx="14" fill="url(#vc-accent)" opacity="0.16" stroke="rgba(139,92,246,0.4)"/>
  <text x="82" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f6ff">Up to 40% off — Mega Sale</text>
  <text x="82" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#aab2d4">Explore top gadgets, fashion and home essentials this week.</text>

  <!-- product cards -->
  <g>
    <rect x="56" y="238" width="190" height="170" rx="14" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="72" y="254" width="158" height="92" rx="10" fill="url(#vc-accent)" opacity="0.22"/>
    <circle cx="120" cy="270" r="12" fill="#22d3ee" opacity="0.6"/>
    <rect x="86" y="306" width="50" height="8" rx="4" fill="#22d3ee" opacity="0.5"/>
    <rect x="72" y="360" width="96" height="10" rx="5" fill="#eef1ff" opacity="0.9"/>
    <rect x="72" y="376" width="60" height="9" rx="4.5" fill="#8b93b4" opacity="0.6"/>
    <text x="72" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">₹1,299</text>

    <rect x="262" y="238" width="190" height="170" rx="14" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="278" y="254" width="158" height="92" rx="10" fill="url(#vc-accent)" opacity="0.22"/>
    <rect x="292" y="268" width="48" height="34" rx="6" fill="#8b5cf6" opacity="0.55"/>
    <rect x="282" y="318" width="60" height="8" rx="4" fill="#8b93b4" opacity="0.5"/>
    <rect x="278" y="360" width="96" height="10" rx="5" fill="#eef1ff" opacity="0.9"/>
    <rect x="278" y="376" width="60" height="9" rx="4.5" fill="#8b93b4" opacity="0.6"/>
    <text x="278" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">₹2,499</text>

    <rect x="468" y="238" width="196" height="170" rx="14" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="484" y="254" width="164" height="92" rx="10" fill="url(#vc-accent)" opacity="0.22"/>
    <path d="M520 292 h36 a6 6 0 0 1 6 6 v0 l-6 22 h-36 l-6 -22 a6 6 0 0 1 6 -6 Z" fill="#22d3ee" opacity="0.6"/>
    <rect x="484" y="360" width="96" height="10" rx="5" fill="#eef1ff" opacity="0.9"/>
    <rect x="484" y="376" width="60" height="9" rx="4.5" fill="#8b93b4" opacity="0.6"/>
    <text x="484" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">₹899</text>
  </g>

  <!-- cart badge -->
  <circle cx="556" cy="98" r="11" fill="#7c5cff"/>
  <text x="556" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
</svg>
