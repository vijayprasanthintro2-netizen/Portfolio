<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vijayprasanth S | MERN Stack Developer</title>
    <meta
      name="description"
      content="MERN Stack Developer portfolio of VijayPrasanth S showcasing full-stack projects, technical skills, internship experience and web development work."
    />
    <meta name="author" content="Vijayprasanth S" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Apply both saved themes before React renders. Only two themes exist for
         each surface; an unset preference always opens in white/light mode. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('vp-theme');
        document.documentElement.setAttribute(
          'data-theme',
          savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light'
        );
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      try {
        var savedAdminTheme = localStorage.getItem('vp-admin-theme');
        document.documentElement.setAttribute(
          'data-admin-theme',
          savedAdminTheme === 'dark' || savedAdminTheme === 'light' ? savedAdminTheme : 'light'
        );
      } catch (error) {
        document.documentElement.setAttribute('data-admin-theme', 'light');
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vijayprasanth S | MERN Stack Developer" />
    <meta
      property="og:description"
      content="Building modern, responsive and scalable web experiences with the MERN stack."
    />
    <meta property="og:image" content="/og-cover.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vijayprasanth S | MERN Stack Developer" />
    <meta
      name="twitter:description"
      content="Building modern, responsive and scalable web experiences with the MERN stack."
    />
    <meta name="twitter:image" content="/og-cover.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
        rel="stylesheet"
      />

  </head>
